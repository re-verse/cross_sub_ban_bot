name: Manual SQLite Test

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Which test to run'
        required: true
        default: 'safe'
        type: choice
        options:
          - safe
          - real
      log_level:
        description: 'Log verbosity'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - verbose

jobs:
  manual-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout sqlite-migration branch
      uses: actions/checkout@v4
      with:
        ref: sqlite-migration
        
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        echo "Installing SQLite bot dependencies..."
        python -m pip install --upgrade pip
        pip install -r requirements_sqlite.txt
        echo "Dependencies installed successfully"
        
    - name: Show test configuration
      run: |
        echo "=== TEST CONFIGURATION ==="
        echo "Test type: ${{ github.event.inputs.test_type }}"
        echo "Log level: ${{ github.event.inputs.log_level }}"
        echo "Branch: sqlite-migration"
        echo "=========================="
        
    - name: Run Safe SQLite Test
      if: ${{ github.event.inputs.test_type == 'safe' }}
      run: |
        echo "🧪 Running SAFE test (no Reddit API required)"
        echo "This tests SQLite performance without external dependencies"
        python test_bot_safe.py
        
    - name: Run Real Reddit API Test
      if: ${{ github.event.inputs.test_type == 'real' }}
      env:
        REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
        REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
      run: |
        echo "🚀 Running REAL test with Reddit API"
        echo "Limited scope: xsubpacttest1 only"
        echo "Max bans: 2 (very conservative)"
        python test_bot_real.py
        
    - name: Performance Summary
      run: |
        echo ""
        echo "=== PERFORMANCE SUMMARY ==="
        python -c "
        from db_utils import BanDatabase
        import os
        import time
        
        if os.path.exists('bans.db'):
            print('📊 SQLite Database Found!')
            start = time.time()
            db = BanDatabase('bans.db')
            records = db.get_all_records()
            stats = db.get_stats()
            load_time = time.time() - start
            
            print(f'⚡ Load time: {load_time:.4f} seconds')
            print(f'📈 Records: {len(records)}')
            print(f'📊 Stats: {stats}')
            print('')
            print('🎯 Google Sheets vs SQLite:')
            estimated_sheets = len(records) * 0.1
            improvement = estimated_sheets / load_time if load_time > 0 else 0
            print(f'   Google Sheets (est): ~{estimated_sheets:.2f}s')
            print(f'   SQLite actual: {load_time:.4f}s') 
            print(f'   Performance gain: ~{improvement:.0f}x faster! 🔥')
        else:
            print('ℹ️  No database file (expected for safe test)')
            print('✅ Safe test completed successfully')
        "
        
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ github.event.inputs.test_type }}
        path: |
          bans.db
          *.log
        retention-days: 3
        
    - name: Test Summary
      if: always()
      run: |
        echo ""
        echo "🎉 Manual SQLite test completed!"
        echo "Test type: ${{ github.event.inputs.test_type }}"
        echo ""
        echo "Next steps:"
        if [ "${{ github.event.inputs.test_type }}" = "safe" ]; then
          echo "✅ Safe test passed - try 'real' test next"
          echo "💡 Real test will use Reddit API (limited scope)"
        else
          echo "🚀 Real test completed - check logs above"
          echo "💡 Ready for production deployment!"
        fi
