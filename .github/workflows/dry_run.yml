name: Dry Run Cross-Sub Ban Bot

# Manual-only. Reads modlogs, writes to a throwaway bans.db on the runner,
# but propagation calls are stubbed — no actual bans/unbans applied.
# Nothing is committed back to the repo.

on:
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot in DRY_RUN mode
        env:
          DRY_RUN: "1"
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
        run: python3 cross_sub_ban_bot.py

      - name: Summarise dry-run output
        if: always()
        run: |
          echo ""
          echo "=== DRY-RUN SUMMARY ==="
          echo "If you saw [DRY-RUN][PROPAGATE-BAN] / [PROPAGATE-UNBAN] lines above,"
          echo "those are the actions a real run would have applied."
          echo "Nothing was committed back to the repo."
