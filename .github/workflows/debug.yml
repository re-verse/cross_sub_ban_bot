name: Debug Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - sqlite-migration

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Workflow triggered successfully!"
          echo "Branch: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
          ls -la .github/workflows/
