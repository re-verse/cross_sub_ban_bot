name: Run Cross-Sub Ban Bot

on:
  schedule:
    - cron: '*/20 * * * *'  # Runs every 20 minutes
  workflow_dispatch:        # Allows you to run it manually

# Never let two bot runs overlap. bans.db is binary — concurrent runs
# create rebase conflicts the push-retry loop cannot resolve. Queue
# instead of cancel so a manual dispatch still runs after a scheduled
# run finishes.
concurrency:
  group: run-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # The bot's actual work takes ~40s; 8 min is generous headroom for a
    # genuine hang while keeping the failure signal fast. Note GHA counts
    # runner-acquisition time against this, so a job that never gets a
    # runner will still be cancelled here — that's a GHA capacity issue,
    # not a bot hang. The watchdog re-dispatches those.
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # --- Server-primary failover guard ---
      # The bot now runs primarily on shkn.ws via a systemd timer, which
      # commits state to main authored by 'csbb-bot (shkn)'. GitHub Actions
      # is the AUTOMATIC BACKUP: it does real work only when the server has
      # gone silent. This checks how long ago the last server commit landed;
      # if recent (< 40 min), the downstream steps skip. A manual
      # workflow_dispatch always proceeds (break-glass).
      - name: Check server heartbeat
        if: github.event_name == 'schedule'
        id: failover
        run: |
          LAST_SERVER=$(git log -1 --format=%ct \
            --author='csbb-bot (shkn)' origin/main 2>/dev/null || echo 0)
          NOW=$(date +%s)
          AGE=$(( (NOW - LAST_SERVER) / 60 ))
          echo "Last server commit was ${AGE} min ago."
          if [ "$LAST_SERVER" -ne 0 ] && [ "$AGE" -lt 40 ]; then
            echo "Server healthy (committed ${AGE} min ago) — GitHub standing down."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Server silent ${AGE} min (or never) — GitHub taking over."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.9
        if: steps.failover.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Install dependencies
        if: steps.failover.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        if: steps.failover.outputs.skip != 'true'
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
        run: python3 cross_sub_ban_bot.py

      - name: Commit and push state
        if: steps.failover.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the database, public log files, and the per-sub health
          # tracker. The bot only re-writes .md/.html when something was
          # actually logged, so on idle runs mostly bans.db and
          # bot_health.json will see touches. -- ignores files that don't
          # exist yet (first creation) without masking other failures.
          for f in bans.db bot_health.json public_ban_log.json public_ban_log.md public_ban_log.html trusted_subs.txt pending_subs.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "Update ban database and public log"
            # Retry pull+push with backoff. GitHub occasionally returns
            # 500 on push (transient backend hiccup); without a retry,
            # the whole run gets flagged failure even though the bot
            # work itself succeeded. Three attempts: 5s, 30s, 120s.
            for delay in 0 5 30 120; do
              if [ "$delay" != "0" ]; then
                echo "::warning::Push attempt failed; retrying in ${delay}s..."
                sleep "$delay"
              fi
              if git pull origin main --rebase && git push; then
                echo "Push succeeded."
                exit 0
              fi
            done
            echo "::error::Push failed after 4 attempts (5s/30s/120s backoff)."
            exit 1
          else
            echo "No state changes to commit."
          fi

      - name: Upload database artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ban-database
          path: bans.db
          retention-days: 7

      # Healthchecks.io dead-man's switch.
      # If HEALTHCHECK_URL secret is set, ping it on successful runs.
      # The healthchecks.io free tier alerts when pings stop arriving on
      # the configured schedule, catching the failure mode the bot
      # cannot signal itself: GitHub Actions silently stops dispatching
      # the cron. Without this, you only notice when something feels
      # wrong (like wondering why a DM hasn't arrived).
      #
      # Setup (one-time):
      # 1. Create a check at healthchecks.io with 20-min schedule + 40-min grace.
      # 2. Copy the ping URL.
      # 3. Add it as a repo secret named HEALTHCHECK_URL.
      # Once the secret is set, this step starts pinging automatically.
      - name: Ping healthcheck (dead-man's switch)
        # Only ping when GitHub actually did the work. If the failover
        # guard skipped (server primary and healthy), the SERVER pings the
        # same check instead — so the dead-man's switch reflects whichever
        # executor is servicing the pact, not GitHub rubber-stamping every
        # skipped cycle.
        if: success() && steps.failover.outputs.skip != 'true'
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" || \
              echo "::warning::Healthcheck ping failed (non-fatal)."
          else
            echo "HEALTHCHECK_URL not set — skipping (this is fine if you haven't enrolled yet)."
          fi
