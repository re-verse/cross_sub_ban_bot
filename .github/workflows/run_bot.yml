name: Run Cross-Sub Ban Bot

on:
  schedule:
    - cron: '*/20 * * * *'  # Runs every 20 minutes
  workflow_dispatch:        # Allows you to run it manually

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
        run: python3 cross_sub_ban_bot.py

      - name: Commit and push state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the database, public log files, and the per-sub health
          # tracker. The bot only re-writes .md/.html when something was
          # actually logged, so on idle runs mostly bans.db and
          # bot_health.json will see touches. -- ignores files that don't
          # exist yet (first creation) without masking other failures.
          for f in bans.db bot_health.json public_ban_log.json public_ban_log.md public_ban_log.html; do
            if [ -e "$f" ]; then git add "$f"; fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "Update ban database and public log"
            git pull origin main --rebase
            git push
          else
            echo "No state changes to commit."
          fi

      - name: Upload database artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ban-database
          path: bans.db
          retention-days: 7
