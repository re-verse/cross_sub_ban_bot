name: Run Cross-Sub Ban Bot

on:
  schedule:
    - cron: '*/20 * * * *'  # Runs every 20 minutes
  workflow_dispatch:        # Allows you to run it manually

# Never let two bot runs overlap. bans.db is binary — concurrent runs
# create rebase conflicts the push-retry loop cannot resolve. Queue
# instead of cancel so a manual dispatch still runs after a scheduled
# run finishes.
concurrency:
  group: run-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # The bot's actual work takes ~40s; 8 min is generous headroom for a
    # genuine hang while keeping the failure signal fast. Note GHA counts
    # runner-acquisition time against this, so a job that never gets a
    # runner will still be cancelled here — that's a GHA capacity issue,
    # not a bot hang. The watchdog re-dispatches those.
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The failover guard below searches history for the last commit
          # authored by 'csbb-bot (shkn)'. actions/checkout defaults to
          # fetch-depth 1 — a single commit — so that search could only
          # ever see the newest commit. Any time the tip wasn't a server
          # commit (right after a PR merge, for instance) the guard
          # concluded "server silent" and GitHub ran the bot itself.
          # Observed: 3 of 6 consecutive scheduled runs took over
          # spuriously. Full history makes the lookup reliable.
          fetch-depth: 0

      # --- Server-primary failover guard ---
      # The bot now runs primarily on shkn.ws via a systemd timer, which
      # commits state to main authored by 'csbb-bot (shkn)'. GitHub Actions
      # is the AUTOMATIC BACKUP: it does real work only when the server has
      # gone silent. This checks how long ago the last server commit landed;
      # if recent (< 15 min), the downstream steps skip. A manual
      # workflow_dispatch always proceeds (break-glass).
      - name: Check server heartbeat
        if: github.event_name == 'schedule'
        id: failover
        env:
          HC_API_KEY: ${{ secrets.HEALTHCHECKS_API_KEY }}
          HC_CHECK_UUID: 6c904f3c-bd1a-4ffe-a0b9-d7c81a2788bc
        run: |
          # Primary signal: the healthchecks.io ping. The server pings it
          # on EVERY run via run-and-push.sh, whether or not there was
          # anything to commit — so it stays fresh through quiet periods.
          #
          # This replaced a git-commit-age check. That check assumed the
          # server commits every cycle, which was only true because
          # bot_health.json (a heartbeat file with per-run timestamps)
          # was committed every 5 minutes. That produced ~288 commits and
          # ~288 GitHub Pages rebuilds a day, and the overlapping builds
          # intermittently failed with duplicate "github-pages" artifacts.
          # bot_health.json is now gitignored, so the server only commits
          # when something real happens — and git commit age is therefore
          # no longer a valid liveness signal.
          SKIP=false
          DECIDED=false

          if [ -n "$HC_API_KEY" ]; then
            RESP=$(curl -fsS -m 15 \
              -H "X-Api-Key: $HC_API_KEY" \
              "https://healthchecks.io/api/v3/checks/$HC_CHECK_UUID" 2>/dev/null || echo "")
            if [ -n "$RESP" ]; then
              LAST_PING=$(echo "$RESP" | jq -r '.last_ping // empty')
              STATUS=$(echo "$RESP" | jq -r '.status // empty')
              if [ -n "$LAST_PING" ]; then
                PING_TS=$(date -u -d "$LAST_PING" +%s 2>/dev/null || echo 0)
                NOW=$(date -u +%s)
                AGE=$(( (NOW - PING_TS) / 60 ))
                echo "healthchecks.io: last ping ${AGE} min ago (status=${STATUS})."
                DECIDED=true
                # 15 min = 3 missed 5-minute cycles.
                if [ "$PING_TS" -ne 0 ] && [ "$AGE" -lt 15 ]; then
                  echo "Server healthy — GitHub standing down."
                  SKIP=true
                else
                  echo "Server silent ${AGE} min — GitHub taking over."
                fi
              fi
            fi
            [ "$DECIDED" = "false" ] && \
              echo "WARNING: healthchecks.io query failed; falling back to git."
          else
            echo "WARNING: HEALTHCHECKS_API_KEY not set; falling back to git."
          fi

          if [ "$DECIDED" = "false" ]; then
            # Fallback only. Since the server no longer commits every
            # cycle, commit age is a weak signal — a quiet pact looks
            # identical to a dead server. Use a deliberately generous
            # threshold so GitHub does not thrash during quiet periods,
            # while still taking over if the server is genuinely gone.
            LAST_SERVER=$(git log -1 --format=%ct \
              --author='csbb-bot (shkn)' origin/main 2>/dev/null || echo 0)
            NOW=$(date +%s)
            AGE=$(( (NOW - LAST_SERVER) / 60 ))
            echo "Fallback: last server commit ${AGE} min ago (threshold 360)."
            if [ "$LAST_SERVER" -ne 0 ] && [ "$AGE" -lt 360 ]; then
              SKIP=true
            fi
          fi

          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.9
        if: steps.failover.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Install dependencies
        if: steps.failover.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        if: steps.failover.outputs.skip != 'true'
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
        run: python3 cross_sub_ban_bot.py

      - name: Commit and push state
        if: steps.failover.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the database, public log files, and the per-sub health
          # tracker. The bot only re-writes .md/.html when something was
          # actually logged, so on idle runs mostly bans.db and
          # bot_health.json will see touches. -- ignores files that don't
          # exist yet (first creation) without masking other failures.
          for f in bans.db public_ban_log.json public_ban_log.md public_ban_log.html trusted_subs.txt pending_subs.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "Update ban database and public log"
            # Retry pull+push with backoff. GitHub occasionally returns
            # 500 on push (transient backend hiccup); without a retry,
            # the whole run gets flagged failure even though the bot
            # work itself succeeded. Three attempts: 5s, 30s, 120s.
            for delay in 0 5 30 120; do
              if [ "$delay" != "0" ]; then
                echo "::warning::Push attempt failed; retrying in ${delay}s..."
                sleep "$delay"
              fi
              if git pull origin main --rebase && git push; then
                echo "Push succeeded."
                exit 0
              fi
            done
            echo "::error::Push failed after 4 attempts (5s/30s/120s backoff)."
            exit 1
          else
            echo "No state changes to commit."
          fi

      - name: Upload database artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ban-database
          path: bans.db
          retention-days: 7

      # Healthchecks.io dead-man's switch.
      # If HEALTHCHECK_URL secret is set, ping it on successful runs.
      # The healthchecks.io free tier alerts when pings stop arriving on
      # the configured schedule, catching the failure mode the bot
      # cannot signal itself: GitHub Actions silently stops dispatching
      # the cron. Without this, you only notice when something feels
      # wrong (like wondering why a DM hasn't arrived).
      #
      # Setup (one-time):
      # 1. Create a check at healthchecks.io with 5-min schedule + 15-min grace.
      # 2. Copy the ping URL.
      # 3. Add it as a repo secret named HEALTHCHECK_URL.
      # Once the secret is set, this step starts pinging automatically.
      - name: Ping healthcheck (dead-man's switch)
        # Only ping when GitHub actually did the work. If the failover
        # guard skipped (server primary and healthy), the SERVER pings the
        # same check instead — so the dead-man's switch reflects whichever
        # executor is servicing the pact, not GitHub rubber-stamping every
        # skipped cycle.
        if: success() && steps.failover.outputs.skip != 'true'
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" || \
              echo "::warning::Healthcheck ping failed (non-fatal)."
          else
            echo "HEALTHCHECK_URL not set — skipping (this is fine if you haven't enrolled yet)."
          fi
