name: Run Cross-Sub Ban Bot

on:
  schedule:
    - cron: '*/20 * * * *'  # Runs every 20 minutes
  workflow_dispatch:        # Allows you to run it manually

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run bot
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
        run: python3 cross_sub_ban_bot.py

      - name: Commit and push database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the changed database file FIRST
          git add bans.db
          
          # Commit the changes, but only if the file has actually changed
          if ! git diff --cached --quiet; then
            git commit -m "Update ban database"
            
            # Now pull with rebase to sync with the remote repository
            git pull origin main --rebase
            
            # Finally, push your commit
            git push
          else
            echo "No changes to the database to commit."
          fi

      - name: Upload database artifact
        if: always() # Run this step even if previous steps fail
        uses: actions/upload-artifact@v4
        with:
          name: ban-database
          path: bans.db
          retention-days: 7
