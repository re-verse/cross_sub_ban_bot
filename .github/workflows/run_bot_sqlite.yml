name: Run Cross-Sub Ban Bot (SQLite)

on:
  schedule:
    - cron: "*/20 * * * *"  # every 20 minutes
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements_sqlite.txt

      - name: Run SQLite bot
        run: python3 cross_sub_ban_bot_sqlite.py
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}

      - name: Commit and push database updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin ${{ github.ref_name }} --rebase || echo "No upstream changes to rebase"
          
          # Add database and any public logs
          git add bans.db public_ban_log.md public_ban_log.json || echo "Some files may not exist yet"
          
          # Commit if there are changes
          git diff --cached --quiet || git commit -m "Update ban database and logs"
          
          # Push changes
          git push || echo "Push failed (may indicate no changes were committed)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-run-artifacts
          path: |
            bans.db
            *.log
            modlog_dump_*.txt
          retention-days: 7
