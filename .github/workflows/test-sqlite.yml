name: SQLite Bot Test

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (safe/real)'
        required: true
        default: 'safe'
        type: choice
        options:
        - safe
        - real
  push:
    branches: [ sqlite-migration ]

jobs:
  test-sqlite-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_sqlite.txt
        
    - name: Run safe test
      if: ${{ github.event.inputs.test_mode == 'safe' || github.event.inputs.test_mode == '' }}
      run: |
        echo "Running safe SQLite test..."
        python test_bot_safe.py
        
    - name: Run real Reddit API test
      if: ${{ github.event.inputs.test_mode == 'real' }}
      env:
        REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
        REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
      run: |
        echo "Running real Reddit API test (limited scope)..."
        python test_bot_real.py
        
    - name: Show database stats
      run: |
        echo "SQLite database statistics:"
        python -c "
        from db_utils import BanDatabase
        import os
        if os.path.exists('bans.db'):
            db = BanDatabase('bans.db')
            stats = db.get_stats()
            print(f'Database stats: {stats}')
        else:
            print('No database file found (expected for safe test)')
        "
        
    - name: Upload database artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sqlite-database
        path: |
          bans.db
          bans_export.csv
        retention-days: 7
